name: update stars

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  stars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: ./scripts/update-stars.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: open a pr if any count changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet && exit 0
          branch=chore/update-stars
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git commit -am "chore: update project stars"
          git push --force origin "$branch"
          gh pr view "$branch" > /dev/null 2>&1 ||
            gh pr create --title "chore: update project stars" \
              --body "weekly refresh from scripts/update-stars.sh"
